<script>
// ==================================================
//   ⭐ CHANGE ME! change a word, save, refresh ⭐
// ==================================================
const GAME = {
  name:   "IDI'S GAME",       // give it a name!
  player: "🛩️",               // any emoji you like
  world:  "city",           // garden · city · candy
  floor:  "ocean",             // auto · grass · ocean · road · candy
  sky:    "magic",            // magic = one whole day, sunrise to sunrise! or one color: pink, black, gold...
  move:   "zigzag",           // zigzag = hold to go up! · float = tap tap tap!
  speed:  7,                  // how fast?
  hole:   150,                // big hole = relaxed, small hole = tricky

};
// ==================================================
//   🌶️ MORE TO CHANGE (when you are ready)
// ==================================================

  level:  20,                 // how long is the day?
  lives:  3,                  // how many hearts?
  jump:   9,                  // float mode: how strong is one tap?
  words:  ["RIGHT", "WAIT", "AGAIN", "TOGETHER"],   // your words fly in the sky — catch them!
  labels: "on",               // on = everything tells you its English name · off = quiet sky
  sound:  "on",               // on · off — blips and chimes
  music:  "calm",             // calm · party · off
  listen: "picture",          // picture = a picture shows the word, write its name · on = it SAYS it · off = it shows the word
  storm:  "on",               // on = a word storm hits in the middle of the day
  password: "on",             // on = finishing a day sets a password for next time
  fx:     "on",               // on = butterflies + magic glow · off = plain (if the phone is slow)
  start:  "WAIT... HOLD TO FLY",
  win:    "YOU MADE IT TO SUNRISE!",
  lose:   "WRONG MOVE!",
  again:  "TRY AGAIN",
  gate:   "WRITE IT TO FLY AGAIN",
};
// ==================================================
//   📖 THE WORD BOOK — what each emoji is called.
//   your emoji missing? add it to the book!
// ==================================================
const WORD_BOOK = {
  "🛩️": "plane", "✈️": "plane", "🐤": "chick", "🐦": "bird", "🦋": "butterfly",
  "🧸": "teddy bear", "🐝": "bee", "🚀": "rocket", "🦄": "unicorn", "🐬": "dolphin",
  "🐱": "cat", "🐶": "dog", "🐢": "turtle", "🐸": "frog", "🦆": "duck",
  "🐧": "penguin", "👻": "ghost", "🤖": "robot", "🐟": "fish", "🦈": "shark",
  "🍓": "strawberry", "🍩": "donut", "🧁": "cupcake", "🍭": "lollipop", "⭐": "star",
  "❤️": "heart", "🔥": "fire", "⚡": "lightning", "🎈": "balloon", "🦅": "eagle",
  "🐉": "dragon", "🐙": "octopus", "🥚": "egg", "🌸": "blossom", "🍕": "pizza",
};
const playerName = () => WORD_BOOK[GAME.player] || "me!";
// ==================================================
//   🖼️ THE PICTURE BOOK — the gate shows the picture,
//   you write its word. new word? give it a picture!
// ==================================================
const PICTURE_BOOK = {
  RIGHT: "✅", WRONG: "❌", WAIT: "⏳", AGAIN: "🔁", TOGETHER: "🤝",
  FLOUR: "🌾", FLOWER: "🌸", OLIVE: "🫒", OIL: "🫗", BOUNCY: "🦘", SOFT: "🪶",
};
function pictureFor(word) {
  const up = (word || "").toUpperCase();
  if (PICTURE_BOOK[up]) return PICTURE_BOOK[up];
  for (const k in WORD_BOOK) if (WORD_BOOK[k].toUpperCase() === up) return k;   // the word book read backwards
  return null;
}
// ==================================================
//   the engine. the map:  [SOUND] blips, chimes, calm & party music, the
//   world's own noises  [SKY] sun, moon, stars, rays, one whole day
//   [WORLD] hills, floors, waves, windmills, boats, trains, petals,
//   fireflies, wind gusts  [WALLS] the three worlds' obstacles
//   [FLIGHT] holding, tapping, the trail  [WORDS] flying words, the word
//   gate, the STORM, the sunrise BONUS, the PASSWORD  [LABELS] everything
//   says its name  [LOOP] one frame of the game
// ==================================================
const canvas = document.getElementById("skyCanvas");
const pen = canvas.getContext("2d");
const $ = id => document.getElementById(id);
let W, H, dpr;
function fitScreen() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  pen.setTransform(dpr, 0, 0, dpr, 0, 0);
  try { makeFg(); } catch (e) {}   // rebuild the foreground strip for the new size
}
fitScreen();
window.addEventListener("resize", fitScreen);

const lerp = (a, b, k) => a + (b - a) * k;
const mixc = (c1, c2, k) => [0, 1, 2].map(i => Math.round(lerp(c1[i], c2[i], k)));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = n => Math.abs(Math.sin(n * 12.9898) * 43758.5453) % 1;

const WALL_W = 78, SPACING = 280, GRAVITY = 0.45, PLAYER_R = 13;
const PLAYER_X = () => Math.min(W * 0.28, 320);
const GROUND = () => H - 30;

let state = "start";        // start · play · gate · storm · bonus · password · end
let playerY, fallSpeed, walls, tokens, trail, particles, ambient, flyer, train, boat;
let score, passed, spawned, lives, collected, gateIdx, gateWord, lastMiddle, runSeed;
let frame = 0, scroll = 0, skyT = 0, grace = 0, shake = 0, freeze = 0, gust = 0, nextGust = 700;
let won = false, pressing = false, keyHeld = false, scorePunch = 1, playerPunch = 1, passStreak = 0;
let gateTries = 0, spokenGate = false, stormDone = false, stormLeft = 0;
let bonusIdx = 0, bonusEarned = 0, bonusTimer = null, celebrated = false;
let best = 0;
try { best = Number(localStorage.getItem("gl-best-" + GAME.name) || 0); } catch (e) {}

const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.62, r: 0.6 + Math.random() * 1.4, tw: Math.random() * 7 }));
// three cloud shapes — all SLOW, each with its own speed and its own direction
const clouds = Array.from({ length: 7 }, (_, i) => ({
  x: Math.random(), y: 0.05 + Math.random() * 0.32, type: i % 3,
  k: 0.6 + Math.random() * 0.7, s: 0.06 + Math.random() * 0.2, a: 0.5 + Math.random() * 0.4,
  dir: Math.random() < 0.5 ? 1 : -1, near: false,
}));
clouds.push({ x: Math.random(), y: 0.1 + Math.random() * 0.2, type: 0, k: 1.9, s: 0.12, a: 0.95, dir: 1, near: true });

const FLOWER_COLS = [[246, 174, 45], [242, 143, 59], [244, 201, 93], [247, 143, 179], [238, 108, 77]];
const LOLLI_COLS  = ["#F45B9C", "#9B5DE5", "#38B6FF", "#FF6B6B"];
const GRAYS       = [[107, 118, 131], [119, 130, 143], [95, 105, 117]];

// film grain, painted once — one texture kills the "flat vector" look everywhere
const grain = document.createElement("canvas");
grain.width = grain.height = 160;
{
  const g2 = grain.getContext("2d"), id = g2.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 96 + Math.random() * 64;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  g2.putImageData(id, 0, 0);
}
// four real six-fold snowflakes, drawn once — lacy arms with side branches
const flakes = [0, 1, 2, 3].map(v => {
  const c = document.createElement("canvas"); c.width = c.height = 56;
  const g = c.getContext("2d"); g.translate(28, 28);
  g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = 1.6; g.lineCap = "round";
  const arm = 22 - v * 2, b1 = 0.35 + hash(v) * 0.15, b2 = 0.65 + hash(v + 9) * 0.15;
  for (let i = 0; i < 6; i++) {
    g.rotate(Math.PI / 3);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -arm);
    for (const bb of [b1, b2]) {
      const by = -arm * bb, bl = arm * 0.32 * (1.25 - bb);
      g.moveTo(0, by); g.lineTo(bl, by - bl);
      g.moveTo(0, by); g.lineTo(-bl, by - bl);
    }
    if (v % 2) { g.moveTo(0, -arm); g.lineTo(3, -arm + 5); g.moveTo(0, -arm); g.lineTo(-3, -arm + 5); }
    g.stroke();
  }
  return c;
});
// blurred out-of-focus foreground blades — the depth-of-field illusion at the frame edge
let fgStrip = null;
function makeFg() {
  fgStrip = document.createElement("canvas"); fgStrip.width = Math.max(W, 300); fgStrip.height = 96;
  const g = fgStrip.getContext("2d");
  if ("filter" in g) g.filter = "blur(3px)";
  g.strokeStyle = "rgba(26,54,30,.6)"; g.lineCap = "round";
  for (let i = 0; i < 26; i++) {
    const bx = (i < 13 ? 0 : fgStrip.width - 180) + hash(i) * 180, hh2 = 30 + hash(i + 4) * 58;
    g.lineWidth = 6 + hash(i + 7) * 7;
    g.beginPath(); g.moveTo(bx, 100);
    g.quadraticCurveTo(bx + 10, 100 - hh2 * 0.6, bx + 18 + hash(i) * 16, 100 - hh2); g.stroke();
  }
}
makeFg();

// ---------------- [SOUND] ----------------
let AC = null, sfxBus, musBus, noiseBuf, echo;
function audioUp() {                       // built on the first tap — browsers require a human gesture
  if (AC || MORE.sound === "off" && MORE.music === "off") return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    sfxBus = AC.createGain(); sfxBus.gain.value = 0.4; sfxBus.connect(master);
    musBus = AC.createGain(); musBus.gain.value = 0.17; musBus.connect(master);
    echo = AC.createDelay(1); echo.delayTime.value = 0.34;
    const fb = AC.createGain(); fb.gain.value = 0.34;
    echo.connect(fb); fb.connect(echo); echo.connect(musBus);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const silent = AC.createBufferSource();                 // iOS unlock
    silent.buffer = AC.createBuffer(1, 1, 22050); silent.connect(master); silent.start(0);
    if (AC.state !== "running") AC.resume();
    setInterval(schedule, 25);                              // the music clock
  } catch (e) { AC = null; }
}
function tone(freq, dur, type = "square", vol = 0.6, slideTo = 0, at = 0, bus = null, pan = 0) {
  if (!AC || MORE.sound === "off" && !bus) return;
  try {
    const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq * (0.97 + Math.random() * 0.06), t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    let out = g;
    if (pan && AC.createStereoPanner) {                    // the sound sits where the thing is
      const pn = AC.createStereoPanner(); pn.pan.value = clamp(pan, -0.9, 0.9);
      g.connect(pn); out = pn;
    }
    out.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function thud(dur = 0.35, from = 1100, to = 120, vol = 0.7) {
  if (!AC || MORE.sound === "off") return;
  try {
    const t = AC.currentTime, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = noiseBuf; f.type = "lowpass";
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(sfxBus); src.start(t); src.stop(t + dur);
    tone(110, dur, "sine", 0.5, 48);
  } catch (e) {}
}
const sfx = {
  flap:  () => tone(190, 0.14, "square", 0.25, 640),
  pass:  () => tone(330 * Math.pow(1.0595, Math.min(passStreak, 12)), 0.07, "triangle", 0.16),
  catch: () => { tone(988, 0.07, "square", 0.4); tone(1319, 0.24, "square", 0.4, 0, 0.07); },
  crash: () => thud(),
  gateOk:() => [523, 659, 784].forEach((f, i) => tone(f, 0.34, "triangle", 0.5, 0, i * 0.1)),
  heartUp:() => { tone(659, 0.14, "triangle", 0.5); tone(988, 0.36, "triangle", 0.5, 0, 0.12); },
  win:   () => [523, 523, 784, 1047].forEach((f, i) => { tone(f, i === 3 ? 0.8 : 0.16, "square", 0.4, 0, i * 0.14); tone(f / 2, i === 3 ? 0.8 : 0.16, "square", 0.2, 0, i * 0.14); }),
  chirp: (pan = 0) => {                    // birdsong: swoop and rise syllables in little phrases
    let at = 0;
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const up = Math.random() < 0.5;
      tone(up ? 1740 : 2500, 0.12, "sine", 0.17, up ? 2100 : 1850, at, null, pan);
      at += 0.2 + Math.random() * 0.15;
    }
  },
  cricket: (pan = 0) => { for (let i = 0; i < 3; i++) tone(4650 + Math.random() * 200, 0.035, "triangle", 0.1, 0, i * 0.05, null, pan); },
  horn:  (pan = 0.7) => [311, 370, 466].forEach(f => tone(f, 1.6, "sawtooth", 0.11, 0, 0, null, pan)),   // the lonesome minor triad
  sparkle:() => [2093, 1568, 1319].forEach((f, i) => tone(f, 0.07, "triangle", 0.12, 0, i * 0.06)),
  wave: () => {                            // a slow swell of filtered noise rolling in
    if (!AC || MORE.sound === "off") return;
    try {
      const t = AC.currentTime, s2 = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      s2.buffer = noiseBuf; s2.loop = true; f.type = "lowpass";
      f.frequency.setValueAtTime(400, t); f.frequency.linearRampToValueAtTime(2800, t + 2); f.frequency.linearRampToValueAtTime(350, t + 4.4);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.06, t + 2); g.gain.linearRampToValueAtTime(0.001, t + 4.5);
      s2.connect(f); f.connect(g); g.connect(sfxBus); s2.start(t); s2.stop(t + 4.6);
    } catch (e) {}
  },
  whoosh:(vol = 0.2) => {
    if (!AC || MORE.sound === "off") return;
    try {
      const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      s.buffer = noiseBuf; s.loop = true; f.type = "bandpass";
      f.frequency.setValueAtTime(250, t); f.frequency.linearRampToValueAtTime(900, t + 0.5);
      f.frequency.linearRampToValueAtTime(200, t + 1.1);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.35);
      g.gain.linearRampToValueAtTime(0.001, t + 1.2);
      s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + 1.25);
    } catch (e) {}
  },
};
// generative music: a lookahead scheduler so notes never drift or stutter
let nextNote = 0, stepN = 0;
const PENTA = [262, 294, 330, 392, 440, 523];
function mnote(freq, dur, type, vol, at, useEcho) {
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
    o.connect(g); g.connect(useEcho ? echo : musBus); o.start(at); o.stop(at + dur + 0.05);
  } catch (e) {}
}
function schedule() {
  if (!AC || MORE.music === "off" || state === "start" || state === "password") return;
  const ahead = AC.currentTime + 0.12;
  if (nextNote < AC.currentTime) nextNote = AC.currentTime;
  while (nextNote < ahead) {
    if (MORE.music === "party") {
      const s = stepN % 8;                                  // 110 BPM, eight 8th-notes per bar
      if (s === 0 || s === 4) tone(150, 0.12, "sine", 0.9, 50, nextNote - AC.currentTime, musBus);
      try {                                                 // hat: a whisper of filtered noise
        const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
        src.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 6000;
        g.gain.setValueAtTime(s % 2 ? 0.12 : 0.2, nextNote); g.gain.exponentialRampToValueAtTime(0.001, nextNote + 0.04);
        src.connect(f); f.connect(g); g.connect(musBus); src.start(nextNote); src.stop(nextNote + 0.05);
      } catch (e) {}
      mnote([65, 65, 49, 55][Math.floor(stepN / 8) % 4], 0.22, "square", s % 4 === 2 ? 0.25 : 0.16, nextNote, false);
      if (Math.random() < 0.3) mnote(PENTA[Math.floor(Math.random() * 6)] * 2, 0.15, "triangle", 0.2, nextNote, true);
      nextNote += 60 / 110 / 2; stepN++;
    } else {                                                // calm: pentatonic rain, any two notes agree
      if (Math.random() < 0.75) mnote(PENTA[Math.floor(Math.random() * 6)], 2.2, "triangle", 0.32, nextNote, true);
      if (stepN % 6 === 0) mnote(stepN % 12 ? 65.4 : 55, 4, "sine", 0.18, nextNote, false);
      nextNote += 1.2 + Math.random() * 1.6; stepN++;
    }
  }
}

// ---------------- [SKY] ----------------
const SKY = [
  { t: 0.00, top: [ 47,  60, 112], mid: [231, 137, 125], low: [255, 214, 160], light: 0.55 },
  { t: 0.25, top: [ 62, 156, 217], mid: [142, 204, 236], low: [215, 238, 248], light: 1.00 },
  { t: 0.50, top: [ 83,  65, 123], mid: [231, 107, 107], low: [255, 180, 108], light: 0.60 },
  { t: 0.75, top: [ 10,  17,  46], mid: [ 25,  34,  78], low: [ 42,  58, 100], light: 0.14 },
  { t: 1.00, top: [ 47,  60, 112], mid: [231, 137, 125], low: [255, 214, 160], light: 0.55 },
];
function skyAt(t) {
  t = ((t % 1) + 1) % 1;
  let a = SKY[0], b = SKY[1];
  for (let i = 0; i < SKY.length - 1; i++)
    if (t >= SKY[i].t && t <= SKY[i + 1].t) { a = SKY[i]; b = SKY[i + 1]; }
  const k = (t - a.t) / (b.t - a.t || 1);

      p.ang += (Math.random() - 0.5) * 0.3;
      p.x += Math.cos(p.ang) * 0.5 - (state === "play" ? GAME.speed * 0.1 : 0); p.y += Math.sin(p.ang) * 0.5;
      const a = 0.15 + 0.6 * (0.5 + 0.5 * Math.sin(frame * 0.05 * p.sp + p.ph));
      pen.save(); pen.globalCompositeOperation = "lighter";
      const g = pen.createRadialGradient(p.x, p.y, 0.5, p.x, p.y, 8);
      g.addColorStop(0, `rgba(255,235,140,${a})`); g.addColorStop(1, "rgba(255,235,140,0)");
      pen.fillStyle = g; pen.beginPath(); pen.arc(p.x, p.y, 8, 0, 7); pen.fill();
      pen.restore();
    } else {
      p.x -= 0.3 + (state === "play" ? GAME.speed * 0.15 : 0);
      const a = 0.3 + 0.6 * Math.abs(Math.sin(frame * 0.08 + p.ph));
      pen.fillStyle = `rgba(255,250,220,${a})`;
      pen.save(); pen.translate(p.x, p.y); pen.rotate(frame * 0.02 + p.ph);
      pen.fillRect(-3, -0.8, 6, 1.6); pen.fillRect(-0.8, -3, 1.6, 6); pen.restore();
    }
  }
  if (labelsOn() && ambient.length > 3) label(want, ambient[0].x, ambient[0].y, 11);
}

// procedural butterflies: wings fold on |sin|, the hindwing lags half a beat,
// the body dips on every downstroke — garden daylight only
let flies = [];
function updateButterflies(s) {
  const t = ((skyT % 1) + 1) % 1;
  const daytime = GAME.sky !== "magic" || t < 0.58;
  if (MORE.fx === "on" && GAME.world === "garden" && daytime && flies.length < 3 && frame % 90 === 0)
    flies.push({ x: W + 30, y: H * (0.18 + Math.random() * 0.45), ph: Math.random() * 7,
                 wob: Math.random() * 7, sc: 0.55 + Math.random() * 0.5, hue: Math.random() });
  flies = flies.filter(f => f.x > -40);
  for (const f of flies) {
    f.ph += 0.24;
    const fold = Math.abs(Math.sin(f.ph)), fold2 = Math.abs(Math.sin(f.ph - 0.55));
    f.x -= 0.5 + (state === "play" ? GAME.speed * 0.18 : 0) + gustK() * 0.3;
    f.y += (0.55 - fold) * 1.3 + Math.sin(frame * 0.013 + f.wob) * 0.5;   // lifts on the stroke
    const cols = f.hue < 0.55 ? ["#E78A2E", "#C25E1E"] : f.hue < 0.8 ? ["#8FB4EE", "#5B7EC9"] : ["#EE9AC4", "#C9699C"];
    pen.save(); pen.translate(f.x, f.y); pen.scale(f.sc, f.sc);
    pen.rotate(Math.sin(frame * 0.02 + f.wob) * 0.18);
    for (const side of [-1, 1]) {
      pen.fillStyle = cols[0];
      pen.beginPath(); pen.ellipse(side * 7 * fold, -3, 8.5 * fold, 6, side * -0.5, 0, 7); pen.fill();
      pen.fillStyle = cols[1];
      pen.beginPath(); pen.ellipse(side * 5.5 * fold2, 4, 6 * fold2, 5, side * 0.4, 0, 7); pen.fill();
    }
    pen.fillStyle = "#3A2B1E"; pen.beginPath(); pen.ellipse(0, 0, 1.8, 7, 0, 0, 7); pen.fill();
    pen.strokeStyle = "#3A2B1E"; pen.lineWidth = 1;
    pen.beginPath(); pen.moveTo(0, -6); pen.lineTo(-3.5, -11); pen.moveTo(0, -6); pen.lineTo(3.5, -11); pen.stroke();
    pen.restore();
  }
  if (labelsOn() && flies.length && playerName() !== "butterfly")   // one label instance per word
    label("butterfly", flies[0].x, flies[0].y - 20, 22, 40, 16);
}

// visiting flyers: planes and birds by day, balloons at golden hours, a shooting star at night
function updateFlyer(s) {
  if (!flyer && Math.random() < 0.009 && state === "play") {
    const t = ((skyT % 1) + 1) % 1;
    const kind = t > 0.6 && t < 0.92 ? "star"
               : (t < 0.08 || (t > 0.42 && t < 0.6)) ? "balloon"
               : Math.random() < 0.5 ? "plane" : "birds";
    flyer = { kind, x: W + 80, y: H * (0.1 + Math.random() * 0.25), life: 0, hue: Math.random() };
    if (kind === "star") { flyer.x = W * (0.3 + Math.random() * 0.5); flyer.y = H * 0.08; sfx.sparkle(); }
    if (kind === "balloon") sfx.whoosh(0.08);
  }
  if (!flyer) return;
  flyer.life++;
  const f = flyer;
  if (f.kind === "star") {
    f.x += 7; f.y += 3.5;
    pen.strokeStyle = "rgba(255,255,255,.85)"; pen.lineWidth = 2.5;
    pen.beginPath(); pen.moveTo(f.x - 42, f.y - 21); pen.lineTo(f.x, f.y); pen.stroke();
    pen.fillStyle = "#fff"; pen.beginPath(); pen.arc(f.x, f.y, 3.4, 0, 7); pen.fill();
    if (labelsOn()) label("star", f.x, f.y, 12, 38, 18);
    if (f.life > 60) flyer = null;
  } else if (f.kind === "balloon") {
    f.x -= 0.8; f.y += Math.sin(f.life * 0.02) * 0.3;
    const cols = f.hue < 0.33 ? ["#E76F51", "#F4A261"] : f.hue < 0.66 ? ["#5B8ED6", "#9BC0F0"] : ["#B95BD6", "#DFA7F0"];
    pen.fillStyle = cols[0]; pen.beginPath(); pen.arc(f.x, f.y, 22, 0, 7); pen.fill();
    pen.fillStyle = cols[1]; pen.beginPath(); pen.arc(f.x - 7, f.y - 4, 14, 0, 7); pen.fill();
    pen.strokeStyle = "rgba(60,40,20,.7)"; pen.lineWidth = 1.5;
    pen.beginPath(); pen.moveTo(f.x - 10, f.y + 18); pen.lineTo(f.x - 6, f.y + 34);
    pen.moveTo(f.x + 10, f.y + 18); pen.lineTo(f.x + 6, f.y + 34); pen.stroke();
    pen.fillStyle = "#7f5539"; pen.fillRect(f.x - 8, f.y + 34, 16, 11);
    if (labelsOn()) label("balloon", f.x, f.y, 13, 48, 34);
    if (f.x < -60) flyer = null;
  } else if (f.kind === "plane") {
    f.x -= 3.2; f.y += Math.sin(f.life * 0.05) * 0.4;
    pen.save(); pen.translate(f.x, f.y);
    pen.fillStyle = "#F5F7FA";
    pen.beginPath(); pen.moveTo(-26, 0); pen.lineTo(22, -7); pen.lineTo(22, 7); pen.closePath(); pen.fill();
    pen.fillStyle = "#D7DEE8";
    pen.beginPath(); pen.moveTo(2, -3); pen.lineTo(16, -18); pen.lineTo(12, 0); pen.closePath(); pen.fill();
    pen.restore();
    if (labelsOn()) label("plane", f.x, f.y, 14, 44, 20);
    if (f.x < -60) flyer = null;
  } else {
    f.x -= 1.6;
    if (frame % 50 === 0 && Math.random() < 0.85) sfx.chirp(f.x / W * 2 - 1);
    pen.strokeStyle = "rgba(30,36,52,.8)"; pen.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const bx = f.x + i * 26 + (i % 2) * 8, by = f.y + (i % 2) * 12;
      const flapK = Math.sin(frame * 0.25 + i) * 6;
      pen.beginPath(); pen.moveTo(bx - 8, by - flapK * 0.5);
      pen.quadraticCurveTo(bx, by - 6 - flapK, bx + 8, by - flapK * 0.5); pen.stroke();
    }
    if (labelsOn()) label("birds", f.x + 30, f.y, 15, 54, 22);
    if (f.x < -140) flyer = null;
  }
}

// ---------------- [WALLS] the three worlds' obstacles ----------------
function hitRects(wall) {
  const x = wall.x, t = wall.top, b = wall.bottom;
  if (GAME.world === "city") return [
    { x: x, y: b, w: WALL_W, h: H - b },
    { x: x + 34, y: 0, w: 10, h: t - 24 },
    { x: x - 8, y: t - 26, w: WALL_W + 16, h: 26 },
  ];
  if (GAME.world === "candy") return [
    { x: x + 8, y: b + 58, w: WALL_W - 16, h: H - b - 58 },
    { x: x - 4, y: b, w: WALL_W + 8, h: 66 },
    { x: x + 22, y: 0, w: 34, h: t - 34 },
    { x: x + 6, y: t - 40, w: WALL_W - 12, h: 40 },
  ];
  return [                                              // garden
    { x: x + 31, y: b + 88, w: 16, h: H - b - 88 },     // slender stem
    { x: x - 6, y: b, w: WALL_W + 12, h: 92 },          // the big bloom
    { x: x + 32, y: 0, w: 14, h: t - 44 },
    { x: x + 9, y: t - 48, w: 60, h: 48 },
  ];
}
function drawWall(wall, s) {
  const x = wall.x, t = wall.top, b = wall.bottom, cx = x + WALL_W / 2, v = wall.v || 0;
  const sway = Math.sin(frame * 0.03 + wall.x * 0.02) * 2;   // idle micro-motion
  pen.save();
  if (GAME.world === "city") {
    const gc = GRAYS[Math.floor(v * 3)];
    const bg = pen.createLinearGradient(x, 0, x + WALL_W, 0);   // one lit face, one shaded face
    bg.addColorStop(0, rgb(mixc(gc, [255, 255, 255], 0.12)));
    bg.addColorStop(1, rgb(mixc(gc, [10, 14, 30], 0.22)));
    pen.fillStyle = bg; pen.fillRect(x, b, WALL_W, H - b);
    pen.fillStyle = "#59636F"; pen.fillRect(x - 5, b, WALL_W + 10, 12);
    pen.fillStyle = s.light < 0.45 ? "#FFD166" : "#B9C3CE";
    for (let wy = b + 22; wy < H - 20; wy += 26)
      for (let wx = x + 10; wx < x + WALL_W - 12; wx += 22) pen.fillRect(wx, wy, 11, 14);
    pen.fillStyle = "#8B95A1"; pen.fillRect(x + 34, 0, 10, t - 24);
    for (let sy = 12; sy < t - 30; sy += 22) {
      pen.strokeStyle = "#7A8492"; pen.lineWidth = 3;
      pen.beginPath(); pen.moveTo(x + 34, sy); pen.lineTo(x + 44, sy + 16); pen.stroke();
    }
    pen.fillStyle = "#E0483E"; pen.fillRect(x - 8 + sway, t - 26, WALL_W + 16, 26);
    pen.fillStyle = "#fff";
    pen.fillRect(x + 6 + sway, t - 26, 14, 26); pen.fillRect(x + 38 + sway, t - 26, 14, 26); pen.fillRect(x + 70 + sway, t - 26, 14, 26);
  } else if (GAME.world === "candy") {
    const pastel = ["#FBD1DE", "#CDEBF7", "#FDF3C6"];
    for (let i = 0, y = H; y > b + 58; y -= 30, i++) {
      pen.fillStyle = pastel[(i + Math.floor(v * 3)) % 3];
      pen.beginPath(); pen.roundRect(x + 8, y - 32, WALL_W - 16, 32, 12); pen.fill();
    }
    pen.fillStyle = LOLLI_COLS[Math.floor(v * LOLLI_COLS.length)];
    pen.beginPath(); pen.arc(cx + sway * 0.5, b + 33, 37, 0, 7); pen.fill();
    pen.strokeStyle = "#fff"; pen.lineWidth = 7;
    pen.beginPath(); pen.arc(cx + sway * 0.5, b + 33, 22, 0.4, 4.2); pen.stroke();
    pen.beginPath(); pen.arc(cx + sway * 0.5, b + 33, 9, 2.6, 6.6); pen.stroke();
    const stripe = v < 0.25 ? "#3E9F5C" : "#E0483E";        // sometimes a mint cane
    pen.fillStyle = "#fff"; pen.beginPath(); pen.roundRect(x + 22, 0, 34, t - 30, 8); pen.fill();
    pen.save(); pen.beginPath(); pen.roundRect(x + 22, 0, 34, t - 30, 8); pen.clip();
    pen.strokeStyle = stripe; pen.lineWidth = 11;
    for (let sy = -20; sy < t + 20; sy += 30) {
      pen.beginPath(); pen.moveTo(x + 10, sy + frame * 0.1 % 30); pen.lineTo(x + 70, sy + 24 + frame * 0.1 % 30); pen.stroke();
    }
    pen.restore();
    pen.fillStyle = stripe; pen.beginPath(); pen.roundRect(x + 6, t - 40, WALL_W - 12, 40, 18); pen.fill();
    pen.fillStyle = "#fff"; pen.beginPath(); pen.roundRect(x + 6, t - 40, WALL_W - 12, 16, 8); pen.fill();
  } else {
    // a slender stem, and a bloom that earns the word "flower"
    pen.fillStyle = "#4E8F45"; pen.fillRect(x + 33, b + 86, 12, H - b - 86);
    pen.fillStyle = "#5FA653";
    for (let ly = b + 124, side = 1; ly < H - 20; ly += 52, side *= -1) {
      pen.beginPath(); pen.ellipse(x + 39 + side * 18 + sway, ly, 17, 7, side * 0.5 + sway * 0.04, 0, 7); pen.fill();
    }
    pen.save(); pen.translate(cx, b + 46); pen.rotate(sway * 0.03);
    const fc = FLOWER_COLS[Math.floor(v * FLOWER_COLS.length)];
    for (let i = 0; i < 12; i++) {                             // big outer petals, shadow side darker
      const a = i / 12 * Math.PI * 2 + 0.3;
      pen.fillStyle = Math.sin(a) > 0.15 ? rgb(mixc(fc, [70, 35, 80], 0.3)) : rgb(fc);
      pen.beginPath(); pen.ellipse(Math.cos(a) * 38, Math.sin(a) * 38, 23, 10, a, 0, 7); pen.fill();
    }
    for (let i = 0; i < 8; i++) {                              // an inner ring of lighter petals
      const a = i / 8 * Math.PI * 2;
      pen.fillStyle = rgb(mixc(fc, [255, 255, 255], 0.35));
      pen.beginPath(); pen.ellipse(Math.cos(a) * 19, Math.sin(a) * 19, 13, 6.5, a, 0, 7); pen.fill();
    }
    pen.fillStyle = "#6B4423"; pen.beginPath(); pen.arc(0, 0, 15, 0, 7); pen.fill();
    pen.fillStyle = "rgba(40,25,12,.5)";                       // seed spiral
    for (let i = 0; i < 7; i++) { pen.beginPath(); pen.arc(Math.cos(i * 2.4) * i * 1.7, Math.sin(i * 2.4) * i * 1.7, 1.6, 0, 7); pen.fill(); }
    pen.restore();
    pen.fillStyle = "#4E8F45"; pen.fillRect(x + 32, 0, 14, t - 44);
    pen.fillStyle = "#5FA653";
    for (let ly = 30, side = 1; ly < t - 56; ly += 40, side *= -1) {
      pen.beginPath(); pen.ellipse(x + 39 + side * 20 + sway, ly, 18, 8, side * 0.5, 0, 7); pen.fill();
    }
    // an honest bee: striped body, dark head, antennae, buzzing wings
    pen.save(); pen.translate(x + 39 + sway, t - 22); pen.rotate(Math.sin(frame * 0.1 + x) * 0.08);
    const wf = Math.sin(frame * 0.5) * 0.35;
    pen.fillStyle = "rgba(255,255,255,.75)";
    pen.beginPath(); pen.ellipse(-4, -11, 9, 5, -0.7 + wf, 0, 7); pen.fill();
    pen.beginPath(); pen.ellipse(5, -11, 9, 5, 0.7 - wf, 0, 7); pen.fill();
    pen.fillStyle = "#F2C14E"; pen.beginPath(); pen.ellipse(0, 0, 14, 9, 0, 0, 7); pen.fill();
    pen.save(); pen.beginPath(); pen.ellipse(0, 0, 14, 9, 0, 0, 7); pen.clip();
    pen.fillStyle = "#332B1E"; pen.fillRect(-3, -10, 5, 20); pen.fillRect(5, -10, 5, 20);
    pen.restore();
    pen.fillStyle = "#332B1E"; pen.beginPath(); pen.arc(-12, -2, 4.5, 0, 7); pen.fill();
    pen.strokeStyle = "#332B1E"; pen.lineWidth = 1.2;
    pen.beginPath(); pen.moveTo(-14, -5); pen.lineTo(-17, -10); pen.moveTo(-12, -6); pen.lineTo(-13, -12); pen.stroke();
    pen.restore();
  }
  pen.restore();
  if (s.light < 0.5 && GAME.sky === "magic") {
    pen.fillStyle = `rgba(10,14,30,${(0.5 - s.light) * 0.55})`;
    for (const r of hitRects(wall)) pen.fillRect(r.x, r.y, r.w, r.h);
  }
}

// ---------------- [WORDS] flying words, the gate, the storm, the bonus, the password ----------------
function drawToken(tk) {
  tk.bob = Math.sin(frame * 0.07 + tk.seed) * 7;
  const y = tk.y + tk.bob;
  const pic = pictureFor(tk.word);        // the pair flies together: picture and word
  const text = pic ? pic + " " + tk.word : tk.word;
  pen.font = "800 17px ui-monospace, Menlo, Consolas, monospace";
  const w = pen.measureText(text).width + 26;
  pen.fillStyle = "rgba(255,255,255,.94)";
  pen.beginPath(); pen.roundRect(tk.x - w / 2, y - 17, w, 34, 999); pen.fill();
  pen.fillStyle = "#E0483E";
  pen.beginPath(); pen.arc(tk.x - w / 2, y, 5, 0, 7); pen.fill();
  pen.fillStyle = "#1c2333"; pen.textAlign = "center"; pen.textBaseline = "middle";
  pen.fillText(text, tk.x + 4, y + 1);
}

let voiceCache = null;
function pickVoice() {           // hunt the least robotic English voice this machine has
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  for (const r of ["natural", "siri", "samantha", "google us", "google uk", "aria", "jenny", "zira"]) {
    const hit = vs.find(v => v.name.toLowerCase().includes(r));
    if (hit) return hit;
  }
  return vs.find(v => v.localService) || vs[0] || null;
}
if ("speechSynthesis" in window && speechSynthesis.addEventListener)
  speechSynthesis.addEventListener("voiceschanged", () => { voiceCache = pickVoice(); });
function sayWord(w) {
  try {
    if (!("speechSynthesis" in window)) return false;
    if (!voiceCache) voiceCache = pickVoice();
    speechSynthesis.cancel();
    const say = (txt, rate) => {
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = "en-US"; u.rate = rate; u.pitch = 1;
      if (voiceCache) u.voice = voiceCache;
      speechSynthesis.speak(u);
    };
    say("The word is... " + w.toLowerCase() + ".", 0.9);   // a carrier sentence gets natural melody
    say(w.toLowerCase() + ".", 0.72);                      // then once more, slower
    return true;
  } catch (e) { return false; }
}
const pickWord = () => MORE.words[Math.floor(Math.random() * MORE.words.length)] || "";
const heartsStr = () => "❤️".repeat(lives) + "🖤".repeat(Math.max(0, MORE.lives - lives));

function showGateScreen(title, sub) {
  $("gateTitle").textContent = title; $("hearts").textContent = sub;
  $("gateScreen").classList.remove("hidden");
}
function hideGateScreen() { $("gateScreen").classList.add("hidden"); }
function setGateShow(text, big) {
  $("gateWordShow").textContent = text;
  $("gateWordShow").classList.toggle("picBig", !!big);
}
function gateSkeleton(word, tries) {      // rung by rung: blanks, then the first letter, then the word
  if (tries >= 2) return word;
  return word.split("").map((ch, i) => i === 0 && tries >= 1 ? ch : "_").join(" ");
}
function presentWord(word) {
  gateTries = 0;                          // nothing auto-plays: SHE presses the button to hear it
  const pic = MORE.listen === "picture" ? pictureFor(word) : null;
  spokenGate = !pic && MORE.listen === "on" && "speechSynthesis" in window;
  $("sayButton").style.display = spokenGate ? "" : "none";
  $("gateHint").classList.toggle("hidden", !pic);
  if (pic) { setGateShow(pic, true); $("gateHint").textContent = gateSkeleton(word, 0); }
  else setGateShow(spokenGate ? "👂 . . . ?" : word);   // write what you HEARD
  $("wordBox").style.display = ""; $("wordBox").value = "";
  setTimeout(() => $("wordBox").focus(), 60);
}
$("sayButton").addEventListener("click", () => { sayWord(gateWord); $("wordBox").focus(); });

function openGate() {
  state = "gate"; walls = []; tokens = []; fallSpeed = 0;
  spawned = passed;                       // refund cleared walls, or the day can never finish
  gateWord = MORE.words[gateIdx % MORE.words.length] || "";
  gateIdx++;
  showGateScreen(MORE.gate, heartsStr());
  presentWord(gateWord);
}
function closeGate() {
  hideGateScreen();
  playerY = H / 2; fallSpeed = 0; grace = 100; trail = []; state = "play";
}
function openStorm() {
  state = "storm"; walls = []; tokens = []; fallSpeed = 0;
  spawned = passed; stormDone = true; stormLeft = 2;
  sfx.whoosh(0.3);
  gateWord = pickWord();
  showGateScreen("A STORM! WRITE TO BLOW IT AWAY!", heartsStr());
  presentWord(gateWord);
}
let bonusStage = "intro", rainbow = 0;
function startBonus() {
  state = "bonus"; celebrated = true; bonusIdx = 0; bonusEarned = 0; bonusStage = "intro";
  sfx.win();
  for (let i = 0; i < 5; i++)
    burst(W * (0.15 + 0.175 * i), H * 0.15, ["#FFD166", "#F45B9C", "#5FA653", "#4EA8DE", "#E0483E"][i], 26, 7);
  // a breath before the round: she presses GO when she's ready
  showGateScreen("BONUS! REMEMBER YOUR WORDS!", "⭐ " + collected.length + " WORDS");
  setGateShow("READY?"); $("gateHint").classList.add("hidden");
  $("wordBox").style.display = "none"; $("sayButton").style.display = "none";
}
function bonusShow() {                    // the word appears, then hides — write it from memory
  $("sayButton").style.display = "none"; $("gateHint").classList.add("hidden");
  setGateShow(collected[bonusIdx]);
  $("wordBox").style.display = "none";
  clearTimeout(bonusTimer);
  bonusTimer = setTimeout(() => {
    setGateShow("? ? ?");
    $("wordBox").style.display = ""; $("wordBox").value = ""; $("wordBox").focus();
    gateTries = 0;
  }, 2000);
}
function askPassword() {
  state = "password";
  $("startScreen").classList.add("hidden");
  showGateScreen("PSSST... LAST TIME'S PASSWORD?", "🔑");
  $("sayButton").style.display = "none"; $("gateHint").classList.add("hidden");
  setGateShow("? ? ?");
  $("wordBox").style.display = ""; $("wordBox").value = ""; gateTries = 0;
  setTimeout(() => $("wordBox").focus(), 60);
}
function tryGate() {
  if (state === "bonus" && bonusStage === "intro") { bonusStage = "word"; $("hearts").textContent = "⭐ +0"; bonusShow(); return; }
  const target = (state === "bonus" ? collected[bonusIdx] : gateWord) || "";
  if ($("wordBox").value.trim().toUpperCase() === target.toUpperCase()) {
    if (state === "gate") { burst(PLAYER_X(), H / 2, "#FFD166", 24); sfx.gateOk(); closeGate(); }
    else if (state === "storm") {
      stormLeft--;
      if (stormLeft > 0) { sfx.gateOk(); gateWord = pickWord(); presentWord(gateWord, MORE.listen === "on"); }
      else {
        if (lives < MORE.lives) { lives++; sfx.heartUp(); } else sfx.gateOk();
        sfx.whoosh(0.25); burst(W / 2, H * 0.3, "#BFD7EA", 40, 8);
        rainbow = 650;                    // the sky says thank you
        closeGate();
      }
    }
    else if (state === "bonus") {
      bonusEarned += 10; score += 10; sfx.catch();
      $("hearts").textContent = "⭐ +" + bonusEarned;
      bonusIdx++;
      if (bonusIdx < collected.length) bonusShow();
      else { hideGateScreen(); showEnd(true); }
    }
    else if (state === "password") {
      sfx.gateOk(); hideGateScreen();
      $("startScreen").classList.remove("hidden"); state = "start";
    }
  } else {
    gateTries++;
    $("wordBox").classList.add("wrong");
    setTimeout(() => { $("wordBox").classList.remove("wrong"); $("wordBox").select(); }, 320);
    const pic = state !== "bonus" && MORE.listen === "picture" && pictureFor(target);
    if (pic) $("gateHint").textContent = gateSkeleton(target, gateTries);   // the ladder climbs
    else if (gateTries >= 2) setGateShow(target);   // kindness: reveal it, she copies it
  }
}
$("goButton").addEventListener("click", tryGate);
$("wordBox").addEventListener("keydown", e => { if (e.key === "Enter") tryGate(); });

// ---------------- [FLIGHT] ----------------
function press(isTap) {
  audioUp();
  if (state === "start") {
    state = "play"; $("startScreen").classList.add("hidden");
  }
  if (state === "play" && isTap) {
    if (GAME.move !== "zigzag") fallSpeed = -MORE.jump;
    sfx.flap();
  }
}
window.addEventListener("pointerdown", e => {
  if (e.target.closest("button") || e.target.closest("input")) return;
  pressing = true; if (state === "start" || state === "play") press(true);
});
window.addEventListener("pointerup", () => { pressing = false; if (AC && AC.state !== "running") AC.resume(); });
window.addEventListener("pointercancel", () => pressing = false);
window.addEventListener("keydown", e => {
  if (state === "gate" || state === "storm" || state === "bonus" || state === "password") return;
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault(); keyHeld = true; if (!e.repeat) press(true);
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "Space" || e.code === "ArrowUp") keyHeld = false;
});

// ---------------- screens & state ----------------
$("gameName").textContent = GAME.name;
$("startEmoji").textContent = GAME.player;
$("startText").textContent = MORE.start;
$("goButton").textContent = "GO!";

function reset() {
  playerY = H / 2; fallSpeed = 0; walls = []; tokens = []; trail = []; particles = []; ambient = [];
  flyer = null; train = null; boat = null; score = 0; passed = 0; spawned = 0; gateIdx = 0; collected = [];
  lives = MORE.lives; skyT = 0; grace = 0; shake = 0; freeze = 0; won = false; frame = 0; scroll = 0;
  lastMiddle = H / 2; runSeed = Math.random() * 1000; scorePunch = 1; playerPunch = 1;
  gust = 0; nextGust = 700; passStreak = 0; stormDone = false; stormLeft = 0;
  bonusIdx = 0; bonusEarned = 0; celebrated = false; gateTries = 0; rainbow = 0;
  clearTimeout(bonusTimer);
}
reset();

// hit-stop chromatic aberration: the frozen frame splits into a red ghost and
// a cyan ghost, re-added a few pixels apart, healing as the freeze thaws
const abSnap = document.createElement("canvas"), abR = document.createElement("canvas"), abC = document.createElement("canvas");
let abAmt = 0;
function hitStop(n, amt) {
  freeze = n; abAmt = MORE.fx === "on" ? amt : 0;
  if (abAmt) {
    abSnap.width = canvas.width; abSnap.height = canvas.height;
    abSnap.getContext("2d").drawImage(canvas, 0, 0);
  }
}
function aberrate(px) {
  for (const [cv, tint] of [[abR, "#f00"], [abC, "#0ff"]]) {
    cv.width = canvas.width; cv.height = canvas.height;
    const g = cv.getContext("2d");
    g.drawImage(abSnap, 0, 0);
    g.globalCompositeOperation = "multiply";
    g.fillStyle = tint; g.fillRect(0, 0, cv.width, cv.height);
  }
  pen.save(); pen.setTransform(1, 0, 0, 1, 0, 0);
  pen.fillStyle = "#000"; pen.fillRect(0, 0, canvas.width, canvas.height);
  pen.drawImage(abR, -px * dpr, 0);
  pen.globalCompositeOperation = "lighter";
  pen.drawImage(abC, px * dpr, 0);
  pen.restore();
}

// palette-tinted bloom: squash the frame small, square it so only the bright
// survives, tint it with the hour's color, add it back over everything
const bloomA = document.createElement("canvas"), bloomB = document.createElement("canvas");
function applyBloom(s) {
  const bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
  const sw = Math.max(2, W >> 4), sh = Math.max(2, H >> 4);
  if (bloomA.width !== bw || bloomA.height !== bh) { bloomA.width = bw; bloomA.height = bh; }
  if (bloomB.width !== sw || bloomB.height !== sh) { bloomB.width = sw; bloomB.height = sh; }
  const ga = bloomA.getContext("2d"), gb = bloomB.getContext("2d");
  ga.drawImage(canvas, 0, 0, bw, bh);
  gb.globalCompositeOperation = "source-over";
  gb.drawImage(bloomA, 0, 0, sw, sh);
  gb.globalCompositeOperation = "multiply";
  gb.drawImage(bloomB, 0, 0);
  gb.fillStyle = rgb(mixc(s.low, [255, 255, 255], 0.45));
  gb.fillRect(0, 0, sw, sh);
  pen.save();
  pen.globalCompositeOperation = "lighter";
  pen.globalAlpha = 0.11 + 0.13 * (1 - s.light);
  pen.drawImage(bloomB, 0, 0, W, H);
  pen.restore(); pen.globalAlpha = 1;
}

function burst(x, y, color, n, spread = 5) {
  for (let i = 0; i < n; i++) particles.push({
    x, y, vx: (Math.random() - 0.5) * spread * 2, vy: (Math.random() - 0.7) * spread * 2,
    life: 40 + Math.random() * 30, color, r: 2 + Math.random() * 3.5,
  });
}

function endGame(didWin) {
  tokens = [];
  if (didWin && collected.length) { startBonus(); return; }   // sunrise bonus round first
  showEnd(didWin);
}
function showEnd(didWin) {
  state = "end"; won = didWin;
  best = Math.max(best, score);
  try { localStorage.setItem("gl-best-" + GAME.name, best); } catch (e) {}
  const isLevel = MORE.mode === "level";
  $("endTitle").textContent = didWin ? MORE.win : MORE.lose;
  $("bar").style.display = isLevel ? "" : "none";
  const pct = didWin ? 100 : Math.round(passed / MORE.level * 100);
  $("endStats").textContent = (isLevel
    ? pct + "%  ·  " + score + " POINTS  ·  BEST: " + best
    : score + "  ·  BEST: " + best) + (bonusEarned ? "  ·  BONUS +" + bonusEarned : "");
  if (collected.length) {
    $("endWords").textContent = "CAUGHT: " + collected.join(" · ");
    $("endWords").classList.remove("hidden");
  } else $("endWords").classList.add("hidden");
  if (didWin && MORE.password === "on" && MORE.words.length) {
    const pw = collected[0] || pickWord();
    try { localStorage.setItem("gl-pass-" + GAME.name, JSON.stringify({ w: pw, t: Date.now() })); } catch (e) {}
    $("endPass").textContent = "🔑 PASSWORD FOR NEXT TIME: " + pw;
    $("endPass").classList.remove("hidden");
  } else $("endPass").classList.add("hidden");
  $("againButton").textContent = MORE.again;
  $("endScreen").classList.remove("hidden");
  setTimeout(() => { $("barFill").style.width = pct + "%"; }, 80);
  if (didWin) {
    if (!celebrated) sfx.win();
    for (let i = 0; i < 5; i++)
      burst(W * (0.15 + 0.175 * i), H * 0.15, ["#FFD166", "#F45B9C", "#5FA653", "#4EA8DE", "#E0483E"][i], 26, 7);
  }
}
$("againButton").addEventListener("click", () => {
  reset(); state = "start";
  $("endScreen").classList.add("hidden"); $("barFill").style.width = "0%";
  $("startScreen").classList.remove("hidden");
});

function die() {
  if (grace > 0) return;
  burst(PLAYER_X(), playerY, "#fff", 30, 6); shake = 13; hitStop(4, 7); passStreak = 0; sfx.crash();
  if (MORE.mode === "level" && lives > 1 && MORE.words.length) { lives--; openGate(); }
  else { lives = 0; endGame(false); }
}

// the password from last time guards the door (only if enough hours have passed)
try {
  if (MORE.password === "on" && MORE.words.length) {
    const raw = localStorage.getItem("gl-pass-" + GAME.name);
    if (raw) {
      const p = JSON.parse(raw);
      if (p.w && Date.now() - p.t > 6 * 3600 * 1000) { gateWord = p.w; askPassword(); }
    }
  }
} catch (e) {}

// ---------------- [LABELS] everything says its own name ----------------
const labelsOn = () => MORE.labels === "on";
function label(text, ax, ay, seed, rx = 36, ry = 15) {
  const a = frame * 0.006 + seed * 1.7;                    // each label slowly circles its thing
  const x = ax + Math.cos(a) * rx, y = ay + Math.sin(a) * ry;
  pen.save();
  pen.font = "700 14px ui-monospace, Menlo, Consolas, monospace";
  const w = pen.measureText(text).width + 20;
  const night = GAME.sky === "magic" && Math.abs(((skyT % 1) + 1) % 1 - 0.75) < 0.13;
  pen.globalAlpha = 0.88;
  pen.fillStyle = night ? "rgba(20,26,48,.85)" : "rgba(255,255,255,.85)";
  pen.strokeStyle = night ? "rgba(255,255,255,.5)" : "rgba(28,35,51,.35)";
  pen.lineWidth = 1;
  pen.beginPath(); pen.roundRect(x - w / 2, y - 12, w, 24, 999); pen.fill(); pen.stroke();
  pen.fillStyle = night ? "#fff" : "#1c2333";
  pen.textAlign = "center"; pen.textBaseline = "middle";
  pen.fillText(text, x, y + 1);
  pen.restore();
}

// ---------------- [LOOP] one frame ----------------
function step() {
  frame++;
  const held = pressing || keyHeld;

  if (freeze > 0) {                                        // hit-stop: the world blinks and splits
    if (abAmt > 0) aberrate(abAmt * Math.min(freeze, 4) / 4);
    freeze--;
    if (freeze === 0) abAmt = 0;
    requestAnimationFrame(step); return;
  }

  if (state === "play") {
    scroll += GAME.speed;
    if (--nextGust <= 0) { gust = 130; nextGust = 700 + Math.random() * 600; sfx.whoosh(0.13); }
    if (gust > 0) gust--;
    if (frame % 170 === 0 && GAME.sky === "magic") {        // night crickets sing in the grass
      const tt = ((skyT % 1) + 1) % 1;
      if (tt > 0.62 && tt < 0.9 && Math.random() < 0.75) sfx.cricket(Math.random() * 1.2 - 0.6);
    }
    if (floorKind() === "ocean" && frame % 560 === 200) sfx.wave();
    if (GAME.move === "zigzag") {
      const target = held ? -GAME.speed * 1.15 : GAME.speed * 1.15;   // 45° up or 45° down
      fallSpeed += (target - fallSpeed) * 0.3;
      if (held && frame % 3 === 0)
        particles.push({ x: PLAYER_X() - 14, y: playerY + 8, vx: -1.2, vy: 0.6, life: 18, color: "rgba(255,255,255,.5)", r: 2.5 });
    } else {
      fallSpeed += GRAVITY;
    }
    playerY += fallSpeed;
    if (playerY < 22) { playerY = 22; fallSpeed = Math.max(0, fallSpeed); }
    if (playerY > GROUND() - 12) { if (grace > 0) { playerY = GROUND() - 12; } else die(); }

    const canSpawn = MORE.mode !== "level" || spawned < MORE.level;
    const lastWall = walls[walls.length - 1];
    if (canSpawn && (!lastWall || lastWall.x < W - SPACING)) {
      // a 45° flight can only climb so much between walls — keep the next gap reachable
      const reach = Math.min(SPACING * 0.65, 200);
      const lo = Math.max(130, lastMiddle - reach), hi = Math.min(H - 190, lastMiddle + reach);
      const middle = lo + Math.random() * (hi - lo);
      lastMiddle = middle;
      walls.push({ x: W + 20, top: middle - GAME.hole / 2, bottom: middle + GAME.hole / 2, passed: false, v: Math.random() });
      spawned++;
      if (MORE.words.length && spawned % 3 === 1)
        tokens.push({ x: W + 20 + SPACING / 2, y: clamp(middle + (Math.random() - 0.5) * 120, 70, GROUND() - 60),
                      word: MORE.words[(Math.ceil(spawned / 3) - 1) % MORE.words.length], seed: Math.random() * 7 });
    }
    for (const wall of walls) {
      wall.x -= GAME.speed;
      if (!wall.passed && wall.x + WALL_W < PLAYER_X()) {
        wall.passed = true; passed++; score++; scorePunch = 1.5; passStreak++; sfx.pass();
        if (MORE.mode === "level" && passed >= MORE.level) { endGame(true); }
        else if (MORE.mode === "level" && MORE.storm === "on" && !stormDone && MORE.words.length && passed === Math.ceil(MORE.level / 2)) openStorm();
      }
      if (state !== "play") break;
      if (grace <= 0) for (const r of hitRects(wall)) {
        const nx = clamp(PLAYER_X(), r.x, r.x + r.w), ny = clamp(playerY, r.y, r.y + r.h);
        if ((PLAYER_X() - nx) ** 2 + (playerY - ny) ** 2 < PLAYER_R ** 2) { die(); break; }
      }
      if (state !== "play") break;
    }
    walls = walls.filter(w => w.x > -WALL_W - 20);
    for (const tk of tokens) {
      tk.x -= GAME.speed;
      if (!tk.got && Math.hypot(tk.x - PLAYER_X(), tk.y - playerY) < 46) {
        tk.got = true; score += 5; collected.push(tk.word);
        burst(tk.x, tk.y, "#FFD166", 18, 4);
        scorePunch = 1.8; playerPunch = 1.35; hitStop(2, 4); sfx.catch();
      }
    }
    tokens = tokens.filter(tk => tk.x > -160 && !tk.got);
    if (grace > 0) grace--;
    trail.push({ x: PLAYER_X(), y: playerY, turn: false });
    if (trail.length > 1 && GAME.move === "zigzag") {
      const a = trail[trail.length - 2];
      if (Math.sign(playerY - a.y) !== Math.sign(a.dy || 0) && a.dy !== undefined) a.turn = true;
      trail[trail.length - 1].dy = playerY - a.y;
    }
    if (trail.length > 130) trail.shift();
  }
  for (const p of trail) if (state === "play") p.x -= GAME.speed;

  // ---- draw ----
  pen.save();
  if (shake > 0) { pen.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.86; if (shake < 0.5) shake = 0; }

  const s = drawSky();
  if (GAME.sky === "magic") drawHills(s);
  if (rainbow > 0) {                                       // after the storm: a real double rainbow
    if (state === "play") rainbow--;
    const kf = Math.min(1, rainbow / 140, (650 - rainbow) / 90);
    const RB = ["#E0483E", "#F28F3B", "#FFD166", "#5FA653", "#4EA8DE", "#6B5BD6", "#B95BD6"];
    pen.save(); pen.lineWidth = 7;
    pen.globalAlpha = 0.05 * kf;                           // Alexander's dark band between the bows
    pen.strokeStyle = "#1a2340"; pen.lineWidth = 46;
    pen.beginPath(); pen.arc(W * 0.6, H + 60, H * 0.75 + 30, Math.PI * 1.05, Math.PI * 1.95); pen.stroke();
    pen.lineWidth = 7;
    RB.forEach((c2, i) => {                                // primary: red outermost
      pen.globalAlpha = 0.2 * kf; pen.strokeStyle = c2;
      pen.beginPath(); pen.arc(W * 0.6, H + 60, H * 0.75 - i * 7, Math.PI * 1.05, Math.PI * 1.95); pen.stroke();
    });
    RB.forEach((c2, i) => {                                // faint secondary: colors reversed
      pen.globalAlpha = 0.08 * kf; pen.strokeStyle = RB[6 - i];
      pen.beginPath(); pen.arc(W * 0.6, H + 60, H * 0.75 + 55 + i * 8, Math.PI * 1.05, Math.PI * 1.95); pen.stroke();
    });
    pen.restore(); pen.globalAlpha = 1;
  }
  drawClouds(s);
  updateFlyer(s);
  updateAmbient(s);
  updateButterflies(s);
  let labeledWall = false;
  for (const wall of walls) {
    drawWall(wall, s);
    if (labelsOn() && !labeledWall && wall.x + WALL_W > PLAYER_X() - 30) {
      label(world().bottomName, wall.x + WALL_W / 2, wall.bottom + 66, 1, 44, 18);
      label(world().topName, wall.x + WALL_W / 2, Math.max(30, wall.top - 56), 2, 44, 18);
      labeledWall = true;
    }
  }
  for (const tk of tokens) drawToken(tk);
  drawFloor(s);

  if (s.light > 0.45 && GAME.sky === "magic" && floorKind() !== "ocean") {
    pen.save(); pen.globalCompositeOperation = "multiply";  // clouds drag their shadows over the ground
    for (const c of clouds) {
      if (c.type === 2) continue;
      pen.fillStyle = `rgba(190,192,205,${0.55 + 0.2 * c.a})`;
      pen.beginPath(); pen.ellipse(c.x * W + 30, GROUND() + 12, 78 * c.k, 9, 0, 0, 7); pen.fill();
    }
    pen.restore();
  }

  // a soft contact shadow on the ground far below the flyer
  if ((state === "play" || state === "gate" || state === "storm") && floorKind() !== "ocean") {
    const hf = clamp((GROUND() - playerY) / GROUND(), 0, 1);
    pen.fillStyle = `rgba(20,12,34,${0.28 * (1 - hf * 0.75)})`;
    pen.beginPath(); pen.ellipse(PLAYER_X(), GROUND() + 8, 24 * (1 - hf * 0.55), 5, 0, 0, 7); pen.fill();
  }

  if (trail.length > 1) {
    for (const [lw, alpha] of [[8, 0.22], [3, 0.95]]) {
      pen.strokeStyle = GAME.trail; pen.globalAlpha = alpha; pen.lineWidth = lw;
      pen.lineJoin = "round"; pen.lineCap = "round";
      pen.beginPath(); pen.moveTo(trail[0].x, trail[0].y);
      for (const p of trail) pen.lineTo(p.x, p.y);
      pen.stroke();
    }
    pen.fillStyle = GAME.trail;
    for (const p of trail) if (p.turn) { pen.beginPath(); pen.arc(p.x, p.y, 4, 0, 7); pen.fill(); }
    pen.globalAlpha = 1;
    if (labelsOn() && state === "play" && trail.length > 40) label("trail", trail[8].x, trail[8].y - 18, 3);
  }

  if (state !== "end" || won) {
    playerPunch += (1 - playerPunch) * 0.15;               // squash, stretch, spring back
    const vstretch = GAME.move === "zigzag" ? clamp(Math.abs(fallSpeed) * 0.014, 0, 0.2) : clamp(-fallSpeed * 0.014, -0.15, 0.25);
    pen.save();
    pen.translate(PLAYER_X(), playerY);
    pen.rotate(GAME.move === "zigzag" ? clamp(fallSpeed * 0.09, -0.7, 0.7) : clamp(fallSpeed * 0.06, -0.5, 1.1));
    pen.scale(playerPunch * (1 - vstretch * 0.5), playerPunch * (1 + vstretch));
    if (grace > 0) pen.globalAlpha = 0.45 + 0.45 * Math.sin(frame * 0.35);
    pen.font = "40px system-ui"; pen.textAlign = "center"; pen.textBaseline = "middle";
    pen.fillText(GAME.player, 0, 0);
    pen.restore();
    if (labelsOn() && state === "play") label(playerName(), PLAYER_X(), playerY, 4, 46, 30);
  }

  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.life--; p.x += p.vx; p.y += p.vy; p.vy += p.drag ? -0.01 : 0.16;
    pen.globalAlpha = clamp(p.life / 40, 0, 1);
    pen.fillStyle = p.color;
    pen.beginPath(); pen.arc(p.x, p.y, p.r, 0, 7); pen.fill();
  }
  pen.globalAlpha = 1;

  if (state === "storm") {                                 // the storm darkens the world and rains
    pen.fillStyle = "rgba(18,24,46,.45)"; pen.fillRect(0, 0, W, H);
    pen.strokeStyle = "rgba(200,215,255,.55)"; pen.lineWidth = 1.5;
    for (let i = 0; i < 70; i++) {
      const rx2 = (hash(i) * W + frame * 7) % W, ry2 = (hash(i + 50) * H + frame * 13) % H;
      pen.beginPath(); pen.moveTo(rx2, ry2); pen.lineTo(rx2 - 5, ry2 + 15); pen.stroke();
    }
  }

  // the finishing washes: bloom, blurred foreground, split toning, film grain, vignette
  if (MORE.fx === "on") applyBloom(s);
  if (GAME.world === "garden" && fgStrip) pen.drawImage(fgStrip, 0, H - 96);   // out-of-focus blades
  pen.save(); pen.globalCompositeOperation = "overlay";    // warm highlights up top, cool shadows below
  const tg = pen.createLinearGradient(0, 0, 0, H);
  tg.addColorStop(0, "rgba(255,180,90,.09)"); tg.addColorStop(1, "rgba(60,90,160,.09)");
  pen.fillStyle = tg; pen.fillRect(0, 0, W, H);
  pen.globalAlpha = 0.06;
  for (let gx = 0; gx < W; gx += 160) for (let gy = 0; gy < H; gy += 160) pen.drawImage(grain, gx, gy);
  pen.restore();
  const vg = pen.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, "rgba(20,16,40,0)"); vg.addColorStop(1, "rgba(20,16,40,.17)");
  pen.fillStyle = vg; pen.fillRect(0, 0, W, H);

  // HUD — labeled like everything else
  if (state === "play" || state === "gate" || state === "storm") {
    scorePunch += (1 - scorePunch) * 0.12;
    pen.font = "800 " + Math.round(44 * scorePunch) + "px system-ui";
    pen.textAlign = "center"; pen.textBaseline = "top";
    pen.fillStyle = "rgba(255,255,255,.95)";
    pen.shadowColor = "rgba(0,0,0,.4)"; pen.shadowBlur = 8;
    pen.fillText(score, W / 2, 14);
    pen.shadowBlur = 0;
    if (labelsOn()) label("score", W / 2, 78, 18, 38, 12);
    if (MORE.mode === "level") {
      const bw = Math.min(W * 0.24, 220);
      pen.fillStyle = "rgba(255,255,255,.3)";
      pen.beginPath(); pen.roundRect(16, 22, bw, 12, 999); pen.fill();
      pen.fillStyle = "#FFD166";
      pen.beginPath(); pen.roundRect(16, 22, Math.max(10, bw * passed / MORE.level), 12, 999); pen.fill();
      pen.beginPath(); pen.arc(16 + Math.max(10, bw * passed / MORE.level), 28, 9, 0, 7); pen.fill();
      pen.font = "700 13px ui-monospace, Menlo, monospace"; pen.textAlign = "left";
      pen.fillStyle = "rgba(255,255,255,.95)";
      pen.fillText((MORE.level - passed) + " TO GO", 16, 42);
      if (labelsOn()) label("the day", 16 + bw / 2, 66, 19, 30, 10);
      pen.textAlign = "right"; pen.font = "26px system-ui";
      pen.fillText("❤️".repeat(lives), W - 14, 16);
      if (labelsOn()) label("lives", W - 20 - lives * 16, 62, 21, 30, 10);
    }
  }
  pen.restore();

  // the sky clock
  if (GAME.sky === "magic") {
    if (MORE.mode === "level") {
      const target = won ? 1 : passed / MORE.level;
      if (state === "play" || state === "end") skyT += (target - skyT) * (won ? 0.03 : 0.012);
    } else if (state === "play") skyT = (skyT + 0.00028) % 1;
  }

  requestAnimationFrame(step);
}
step();
</script>
