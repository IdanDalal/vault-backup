; jepFixes: Amalgamation combo curation, Idi's five rules of 2026-09-16. Pairwise exclusions, same key the base mod documents and Stukov's mod uses (8,874 pairs already active).
; R1 no secondary weapon: secondary spec without a secondary weapon x tertiary spec without one (Gripsman, Recon Officer, Siege Gunner x Keeper, Saboteur, MEC specs, ...).
; R3 foreign primary weapon: a secondary/tertiary spec that demands a primary-slot weapon the primary spec cannot use (Commissar rifle under Boltcaster, Riot shotgun under Vektor, ...).
; R4 same squaddie skill twice (Shadow + Recon Officer both Phantom, Gunslinger + Gunfighter both pistol shot, ...).
; R2 (file B only) two different secondary weapons: secondary x tertiary specs whose secondary-slot weapon types do not overlap. Pairs that share a weapon type stay (pistol + pistol).
; Changing exclusions mid-campaign is unsupported by the mod author. New campaign only.

