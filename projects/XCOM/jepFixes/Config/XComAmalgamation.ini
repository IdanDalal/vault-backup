; jepFixes 2026-09-28 (round 2, Idi): released for snipers: Officer (holotargeter, acts from the sniper's tile) and
; ChryssalidWhisperer (summons a Chryssalid; its perks buff the pet). Rockets stay excluded. 20 pairs removed above.

; jepFixes 2026-09-28 (audit fix): R3 foreign primary weapon, missed on 09-17: DronePilot needs a pistol/sidearm primary slot,
; Interceptor (3664901937, added 09-17) can use only an smg there. Removes Interceptor_DronePilot_Sentinel/_Retaliator.


; jepFixes 2026-11-08 (Idi: remove redundant/out-of-date): 22 pairs dropped that named a spec no active mod defines:
; ARFMTeslaTrooper, Arcstrider, Vindicator. Re-enabling one of those mods needs a regenerate against the current rules.

; jepFixes 2026-11-08 (Idi: 'all rec', amalgamation-zero-specs-2026-11-08.md): 121 pairs deleted below and above.
; X1 R3 fix: R3 pairs dropped for AlienHunter2, DronePilot, SwordMaster, Riot, Ironclad, LegendaryWarrior (their trees never fire
;    from the primary slot; listed primary weapons are permissions). W-rule pairs kept.
; Exemptions by design: Ravager + empty-slot secondaries; Savage + Butterfly knife; Brigand under shotgun primaries; SkvRaider any
;    primary; SwordMaster with sword secondaries and sword primaries with shield secondaries; both Xeno Zoologists + pistol/autopistol
;    secondaries; Androctonus + pistol/autopistol secondaries (sniper whitelist + W2); AlienHunter2 exempt from W1.

; jepFixes 2026-11-10: 6 R2 pairs Phoenix x weapon tertiary deleted (Agent, Commando, Engineer, Executioner, Liquidator,
;    Officer): a canister beside a chemthrower sits in Mitzruti's aux slot, so Phoenix leaves the secondary slot free.

; jepFixes 2026-10-29, Idi's weapon slot optimization. A spec 'carries' a weapon in its own slot (primary spec: primary
; slot; secondary/tertiary spec: secondary slot), checked against where each tree's abilities land.
; W1 sword primary (HareCaptain, MusaSamurai, Ravager, Savage) <-> sword secondary (ARFMPlunderer, AlienHunter2, Blademaster, Brigand, Corsair, HareSwash, LegendaryWarrior, NinjaWarrior, SkvRaider).
; W2 pistol primary (Akimbo, Fusilier, Gunfighter, HareQuartermaster, Pistoleer, Vigilante) only with a secondary whose kit holds a pistol (adds Ironclad: pistol + shield);
;    pistol secondary (Corpsman, Gunslinger, HareBuckler, HareGrimArtist, Hotshot, Rogue, SkvStygian, Trickshot) only with a pistol primary. Replaces the 09-28 P1c DisableClass list.
; W3 gauntlet: Burner <-> Heavy, SkvFirebug.  W4 gremlin tertiary (SkvArtisan, HareModernPirate) only with a gremlin secondary.
; W5 cannon primary (Dreadnought, Gunner, Harbinger, SAWGunner, Wrecker) only with SkvSiegeGunner (the reverse was already the authors' rule).
; W6 shield secondary (Ironclad, Vengeance2) <-> shield tertiary (AegisDefender, Riot, SwordMaster).
