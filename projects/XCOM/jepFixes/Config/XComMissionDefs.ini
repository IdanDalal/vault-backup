; jepFixes 2026-09-26: Emergency Defense removed, on Idi's word ("never spawn": open VIP, no evac, Bradford ambush, hold 4 turns).
; Source: Additional Mission Types Redux 1133287457 Config/XComMissionDefs.ini:65,94,123. Family Extract keeps ExtractVIP + MRExtract.
; The '-' lines are byte copies of the source '+' lines. Probe: Launch.log loses the three 'BeneathSuspicionMission: Current mission sType is  EmergencyDefense_*' lines.

[XComGame.XComTacticalMissionManager]

-arrMissions=(MissionName="EmergencyDefense_Reapers", sType="EmergencyDefense_Reapers", \\
	MissionFamily="Extract", \\
	MapNames[0]="Obj_EmergencyDefense", \\
	MapNames[1]="UMS_MissionCore", \\
	CiviliansAlwaysVisible=true, \\
	RequiredPlotObjectiveTags[0]="CityCenter", \\
	RequiredPlotObjectiveTags[1]="Council", \\
	RequiredParcelObjectiveTags[0]="Neutralize", \\
	MissionObjectives[0]=(ObjectiveName="VIP", \\
	bIsTacticalObjective=false, bIsStrategyObjective=true, bIsTriadObjective=true), \\
	MissionSchedules[0]="Council_D1_EmergencyReapers", \\
	MissionSchedules[1]="Council_D2_EmergencyReapers", \\
	MissionSchedules[2]="Council_D3_EmergencyReapers", \\
	MissionSchedules[3]="Council_D4_EmergencyReapers", \\
