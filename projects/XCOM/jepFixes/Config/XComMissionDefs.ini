	MissionSchedules[5]="Council_D6_EmergencyReapers", \\
	MissionSchedules[6]="Council_D7_EmergencyReapers", \\
	MissionSchedules[7]="Council_DX_Horde_EmergencyReapers", \\
	DisallowUITimerSuspension=true, \\
	ForcedSitreps[0] = "TheLost",\\
	)

