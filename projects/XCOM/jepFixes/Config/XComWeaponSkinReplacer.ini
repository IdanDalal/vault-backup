; jepFixes: Weapon Skin Replacer hide list. Idi's standard, final wording 2026-09-15: a weapon with a distinct gameplay quality (own stats, an added ability, a new mechanic) stays an item whatever its category;
; a near-identical variant of a vanilla weapon is a skin (XSkin keeps it wearable). Skins = (1) every weapon whose damage, aim, crit and clip equal a vanilla weapon's with no added ability, per the source and config audit;
; (2) all of Resistance Firearms (ruling C); (3) the TLP visual-attachment duplicates, identical by their author's description. Items: everything else, Katana, Axe, Cosmo Dragoon, Central's and Uejji's battle rifles, Beowulf, Hunter Rifles included.

