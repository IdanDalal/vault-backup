; jepFixes 2026-09-19: covert action levers, on Idi's word (captures 2026-09-19).
; 1. Capture risk off. Configurable Posthumous Risks (2823200756) swaps the risk's availability function for one that
;    returns false; the Highlander then never attaches the risk to any covert action (XComGameState_CovertAction.uc:969).
;    Ambush stays as that mod ships it (alwaysOn); an ambush is a playable mission under Covert Infiltration.
; 2. Eight covert actions never offered at random. Covert Infiltration (2567230730) answers false to the Highlander's
;    AllowActionToSpawnRandomly event for every name in this list (X2EventListener_Infiltration.uc:535).
;    Both AlienLoot (base, CI already lists it) and AlienCorpses (CI) show on screen as "Scavenge Alien Loot".
; Verify in game: the Covert Actions screen shows no Soldier Captured risk and none of the eight names.

[ConfigurablePosthumousRisks.X2DownloadableContentInfo_ConfigurablePosthumousRisks]
+ChangeRisk=(RiskName="CovertActionRisk_SoldierCaptured", Behavior=alwaysOff)

[CovertInfiltration.X2EventListener_Infiltration]
+CovertActionsPreventRandomSpawn=CovertAction_FormSoldierBond
+CovertActionsPreventRandomSpawn=CovertAction_GatherIntel
+CovertActionsPreventRandomSpawn=CovertAction_GatherSupplies
+CovertActionsPreventRandomSpawn=CovertAction_SharedAbilityPoints
+CovertActionsPreventRandomSpawn=CovertAction_AlienLoot
+CovertActionsPreventRandomSpawn=CovertAction_AlienCorpses
+CovertActionsPreventRandomSpawn=CovertAction_ExperimentalItem
+CovertActionsPreventRandomSpawn=CovertAction_PatrolWilderness
+CovertActionsPreventRandomSpawn=CovertAction_UtilityItems
