; jepFixes: [WOTC] Loot Post Mover 2043070900. Idi 2026-09-15: all field loot expires after 3 turns (psi loot was 2).
; Section fixed 2026-09-28: these keys live on XComGameState_LootDropSplitter, config(LootPostMover) (XComGameState_LootDropSplitter.uc:12,24-25);
; the 09-15 header named the DLCInfo class, so the rule never applied.

[WOTCLootPostMover.XComGameState_LootDropSplitter]
bLootExpirationEnabled = true
iLootExpirationMaxTurns = 3
bLootExpirationEnabled_Psi = true
iLootExpirationMaxTurns_Psi = 3

; jepFixes 2026-11-12 (block audit): logging on until a psi loot drop is seen in Launch.log ("Loot Drop was PsiLoot - Timer set at 3").
; bEnableLogging is a config bool on the DLCInfo class (X2DownloadableContentInfo_WOTCLootPostMover.uc:11-13). Switch off after the proof.
[WOTCLootPostMover.X2DownloadableContentInfo_WOTCLootPostMover]
bEnableLogging = true
