; jepFixes 2026-09-28 (audit fix): the WSR hide list hides MBR_MJ_MG/BM and MMG_MJ_MG/BM (CBR Redux 1349983893, vanilla-stat copies),
; and WSR also switches off their schematics MBR_MJ_MG_Schematic / MBR_MJ_BM_Schematic. Those same schematics create the carbines
; MCAR_MJ_MG / MCAR_MJ_BM (X2Item_ValhallaRifles.uc:3175,3279), which are kept as items, so the carbines could never reach tier 2/3.
; Iridar's Template Master X2DLCInfo_Last runs RUN_LAST with RunAfter=zzzWeaponSkinReplacer (2363075446 Config/XComGame.ini:17-24),
; so this turns the two schematics back on after WSR. Side effect: building them also yields the hidden MBR/MMG copies (vanilla stats).

[WOTCIridarTemplateMaster.X2DLCInfo_Last]
+Edit_X2SchematicTemplate = (T = "MBR_MJ_MG_Schematic", P = "CanBeBuilt", V = "true")
+Edit_X2SchematicTemplate = (T = "MBR_MJ_BM_Schematic", P = "CanBeBuilt", V = "true")
