; jepCovertBlock 2026-11-12 (Idi ruling K1). The nine covert actions Idi blocked on 2026-09-19, swept off the board whenever the
; world map opens or regains focus. Started actions are never touched. bReplace: the faction draws a replacement from its pool.
; ProbeCommands run once per map load; their output lands in Launch.log (tag jepCovertBlock).

[jepCovertBlock.UISL_jepCovertBlock]
bReplace=true
bLogState=true
+BlockedActions=CovertAction_FormSoldierBond
+BlockedActions=CovertAction_GatherIntel
+BlockedActions=CovertAction_GatherSupplies
+BlockedActions=CovertAction_SharedAbilityPoints
+BlockedActions=CovertAction_AlienLoot
+BlockedActions=CovertAction_AlienCorpses
+BlockedActions=CovertAction_ExperimentalItem
+BlockedActions=CovertAction_PatrolWilderness
+BlockedActions=CovertAction_UtilityItems
+ProbeCommands="getall X2EventListener_Infiltration CovertActionsPreventRandomSpawn SHOWDEFAULTS"
